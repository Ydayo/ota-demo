# ローカル開発用のミドルウェア。アプリ(apps/web)はホストで起動する。
# 起動: pnpm infra:up / 停止: pnpm infra:down

name: ota-demo

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ota
      POSTGRES_PASSWORD: ota
      POSTGRES_DB: ota
    ports:
      - "5432:5432"
    # PostgreSQL 18 以降は /var/lib/postgresql にマウントする(PGDATA がバージョン別のサブディレクトリになったため)
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ota -d ota"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI / API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

  fake-supplier:
    build:
      context: .
      dockerfile: apps/fake-supplier/Dockerfile
    ports:
      - "4010:4010"
    environment:
      PORT: "4010"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
