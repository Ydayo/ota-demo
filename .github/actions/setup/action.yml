# Node と pnpm を用意し、依存をインストールする。
# 版は package.json で固定する(Node: volta.node、pnpm: packageManager。ADR-0012)。
name: setup
description: Node と pnpm を用意し、依存をインストールする

inputs:
  install:
    description: 依存をインストールするか
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: package.json
        cache: pnpm
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
