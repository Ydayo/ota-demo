# CI(最終ゲート。ADR-0007)。
# ルールセット main-protection の必須チェックは、集約ジョブ ci-ok だけにする。
# ジョブを追加したら ci-ok の needs にも追加すること。

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  depcruise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm depcruise

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm vitest run --project unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Testcontainers で PostgreSQL を起動する(GitHub のホストランナーには Docker がある)
      - run: pnpm test:integration

  # 受け入れテスト(tests/acceptance/)。要件IDとの対応は harness-checks の要件トレーサビリティが検査する。
  # 仕様が空の間はテストがないため、テストがなくても成功させる。
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm vitest run --project acceptance --passWithNoTests

  # ハーネスの自己テスト(hooks、依存ルール、検査スクリプトが違反を検出できること)
  harness-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:harness

  # ハーネスの検査(Route Handler と Server Actions、要件トレーサビリティ、Grilling 記録)
  harness-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node tooling/harness/src/checks/run.ts repo

  # PR の分離(ADR-0016): 実装を変更する PR は、仕様・用語集・ADR・憲法と受け入れテストを変更しない。
  # 検査スクリプトと保護対象の分類は base 側の版を使う(PR 側で書き換えて素通りさせないため)。
  pr-separation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          script="$RUNNER_TEMP/base/tooling/harness/src/checks/run.ts"
          if [ ! -f "$script" ]; then
            # この検査を導入する PR だけが該当する
            echo "::warning::base に検査スクリプトがないため、PR 側の版で検査します"
            script="tooling/harness/src/checks/run.ts"
          fi
          node "$script" pr-separation --root "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA"

  # 集約ジョブ。ルールセットの必須チェックはこのジョブだけにする。
  # always(): 依存ジョブの失敗時や run のキャンセル時も必ず実行する。
  #   (実行されずに skipped になると、必須チェックとしては成功扱いになるため)
  # すべて成功(pr-separation は push では skipped)のときだけ成功する。
  ci-ok:
    if: always()
    needs:
      - typecheck
      - lint
      - depcruise
      - unit
      - integration
      - acceptance
      - harness-self-test
      - harness-checks
      - pr-separation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS" | jq -e --arg event "$EVENT" '
            to_entries
            | map(select(
                .value.result != "success"
                and ((.key == "pr-separation" and $event != "pull_request" and .value.result == "skipped") | not)
              ))
            | if length == 0 then true
              else (map("\(.key): \(.value.result)") | join("\n") | halt_error(1))
              end
          '
