# CI(最終ゲート。ADR-0007)。
# ルールセット main-protection の必須チェックは、集約ジョブ ci-ok だけにする。
# ジョブを追加したら ci-ok の needs にも追加すること。

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  depcruise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm depcruise

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm vitest run --project unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Testcontainers で PostgreSQL を起動する(GitHub のホストランナーには Docker がある)
      - run: pnpm test:integration

  # 受け入れテスト(tests/acceptance/)。要件IDとの対応は harness-checks の要件トレーサビリティが検査する。
  # 仕様が空の間はテストがないため、テストがなくても成功させる。
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm vitest run --project acceptance --passWithNoTests

  # ハーネスの自己テスト(hooks、依存ルール、検査スクリプトが違反を検出できること)
  harness-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:harness

  # ハーネスの検査(Route Handler と Server Actions、要件トレーサビリティ、Grilling 記録)
  harness-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node tooling/harness/src/checks/run.ts repo

  # PR の分離(ADR-0016): 実装を変更する PR は、仕様・用語集・ADR・憲法と受け入れテストを変更しない。
  # 検査スクリプトと保護対象の分類は base 側の版を使う(PR 側で書き換えて素通りさせないため)。
  pr-separation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          node "$RUNNER_TEMP/base/tooling/harness/src/checks/run.ts" pr-separation \
            --root "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA"

  # ミューテーションテスト(ADR-0019)。パッケージごとの閾値を下回れば失敗する
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node tooling/harness/src/mutation/run.ts
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-reports
          path: |
            apps/*/reports/mutation/
            packages/**/reports/mutation/
          retention-days: 7

  # E2E(Playwright + axe。ADR-0019)。本番モード(next build → next start)で検査する
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ota
          POSTGRES_PASSWORD: ota
          POSTGRES_DB: ota
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ota -d ota"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @ota/tests exec playwright install --with-deps chromium
      - run: pnpm --filter @ota/web build
      - run: pnpm --filter @ota/tests e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

  # OpenAPI の破壊的変更の検知(oasdiff の CLI。ADR-0012、ADR-0019)。
  # apps/web/openapi.json が API の定義と一致することは、単体テスト(openapi.test.ts)が検査する。
  openapi:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OASDIFF_VERSION: 1.32.1
      # リリースの checksums.txt にある oasdiff_1.32.1_linux_amd64.tar.gz の SHA-256
      OASDIFF_SHA256: 7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f
      OASDIFF_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: oasdiff を導入する
        run: |
          archive="$RUNNER_TEMP/oasdiff.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" oasdiff
      - name: base と比べて破壊的変更がないことを確かめる
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git cat-file -e "$BASE_SHA:apps/web/openapi.json" 2>/dev/null; then
            echo "::notice::base に apps/web/openapi.json がないため比較しません(導入する PR のみ)"
            exit 0
          fi
          git show "$BASE_SHA:apps/web/openapi.json" > "$RUNNER_TEMP/base-openapi.json"
          "$RUNNER_TEMP/oasdiff" breaking "$RUNNER_TEMP/base-openapi.json" apps/web/openapi.json --fail-on ERR

  # 集約ジョブ。ルールセットの必須チェックはこのジョブだけにする。
  # always(): 依存ジョブの失敗時や run のキャンセル時も必ず実行する。
  #   (実行されずに skipped になると、必須チェックとしては成功扱いになるため)
  # すべて成功(pr-separation と openapi は push では skipped)のときだけ成功する。
  ci-ok:
    if: always()
    needs:
      - typecheck
      - lint
      - depcruise
      - unit
      - integration
      - acceptance
      - harness-self-test
      - harness-checks
      - pr-separation
      - mutation
      - e2e
      - openapi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS" | jq -e --arg event "$EVENT" '
            to_entries
            | map(select(
                .value.result != "success"
                and ((.key | IN("pr-separation", "openapi")) and $event != "pull_request" and .value.result == "skipped" | not)
              ))
            | if length == 0 then true
              else (map("\(.key): \(.value.result)") | join("\n") | halt_error(1))
              end
          '
